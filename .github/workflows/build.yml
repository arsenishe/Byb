name: Build Bedrock Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir source
          unzip "$ARCHIVE" -d source
          SETTINGS=$(find source -name settings.gradle.kts | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java and Kotlin compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          s = s.replace(
              "    defaultConfig {",
              """    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {"""
          )
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bedrock-Launcher-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
